<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supernatural The Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bonus-screen" class="bonus-screen">
      <div class="bonus-video-wrapper">
        <iframe
          id="bonus-trailer-iframe"
          width="921"
          height="518"
          src="https://www.youtube.com/embed/t-775JyzDTk"
          title="Supernatural Season 1 Trailer"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <button id="bonus-next-btn" class="bonus-next-btn" type="button">Next</button>
    </div>

    <div id="intro-screen1" class="intro-screen1">
      <h1 id="story-intro1">
        "Dad`s on a hunting trip and he hasn`t been home in a few days."
      </h1>
      <button id="next-button1" type="button">Next</button>
      <div class="intro-speaker intro-speaker-left">
        <img src="./images/DeanTalks.png" alt="Dean talking" />
      </div>
    </div>

    <div id="intro-screen2" class="intro-screen2">
      <h1 id="story-intro2">"Jess, excuse us!</h1>
      <button id="next-button2" type="button">Next</button>
      <div class="intro-speaker intro-speaker-right">
        <img src="./images/SamJess.png" alt="Sam and Jess" />
      </div>
    </div>

    <div id="start-game-screen" class="start-game-screen">
      <div id="choice1" class="choice" data-character="sam">
        <img src="./images/Sam.png" alt="Sam" />
        <span class="choice-name">Sam</span>
      </div>
      <div id="choice2" class="choice" data-character="dean">
        <img src="./images/Dean.png" alt="Dean" />
        <span class="choice-name">Dean</span>
      </div>
      <h1>Supernatural</h1>
      <h3>THE GAME</h3>
      <p>Use the "A" and "D" keys to help the Winchesters jump and move.</p>
      <p>Use the spacebar to make them jump.</p>
      <p>Use the mouse left button to shoot</p>
      <button id="start-game-btn" class="start-game-btn" type="button">START GAME</button>
    </div>

    <div id="game-screen" class="game-screen">
      <div id="floor" class="floor"></div>
    </div>

    <div id="gameover-screen" class="gameover-screen">
      <h1 id="you-lost">
        "YOU LOST"
      </h1>
      <button id="restart-gameover-btn" class="restart-btn" type="button">Play Again</button>
    </div>

    <div id="win-screen" class="win-screen">
      <h1>YOU WIN</h1>
      <button id="restart-win-btn" class="restart-btn" type="button">Play Again</button>
    </div>

    <script src="./JS/player.js"></script>
    <script src="./JS/collision.js"></script>
    <script src="./JS/enemy.js"></script>
    <script src="./JS/bobby.js"></script>
    <script src="./JS/bullet.js"></script>
    <script src="./JS/heaven.js"></script>
    <script src="./JS/index.js"></script>
  </body>
</html>
