<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supernatural The Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="intro-screen1" class="intro-screen1">
      <h1 id="story-intro1">
        "Dad`s on a hunting trip and he hasn`t been home in a few days."
      </h1>
      <button id="next-button1">Next</button>
    </div>

    <div id="intro-screen2" class="intro-screen2">
      <h1 id="story-intro2">"Jess, excuse us!</h1>
      <button id="next-button2">Next</button>
    </div>

    <div id="start-game-screen" class="start-game-screen">
      <div id="choice1" class="choice"></div>
      <div id="choice2" class="choice"></div>
      <h1>Supernatural</h1>
      <h3>THE GAME</h3>
      <p>Use the "A" and "D" keys to help the winchesters jump and move.</p>
      <p>Use the spacebar to make them jump.</p>
      <p>Use the mouse left button to shoot</p>
      <button id="start-game-btn" class="start-game-btn">START GAME</button>
    </div>

    <div id="game-screen" class="game-screen">
      <div id="floor" class="floor"></div>
    </div>

    <div id="gameover-screen" class="gameover-screen"></div>

    <div id="win-screen" class="win-screen"></div>

    <script src="./JS/player.js"></script>
    <script src="./JS/collision.js"></script>
    <script src="./JS/enemy.js"></script>
    <script src="./JS/index.js"></script>
  </body>
</html>
